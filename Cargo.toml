[package]
name = "mtasks-rusty"
version = "0.16.0"
edition = "2021"

# The executable is named after the app: macOS uses it for the process name and
# the "About/Hide/Quit" items in the app menu.
[[bin]]
name = "JAIT"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio", "canvas", "lazy", "image", "advanced", "svg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
dirs = "5"
toml = "0.8"
thiserror = "1"
csv = "1"
rfd = "0.15"
mac-notification-sys = "0.6.15"
md-5 = "0.10"
base64 = "0.22"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"
pulldown-cmark = { version = "0.13", default-features = false }
semver = "1"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }

# Terminal engine (docs/adr/0002). Pinned and upgraded together, on purpose:
# libghostty-vt commit + Zig 0.17.1 (mise.toml) + portable-pty. crates.io 0.2.2
# only builds on Zig 0.15, so it is not usable. Only src/terminal/engine.rs
# touches libghostty-vt and portable-pty.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "3d8befe806d9c0801919b7c0209d4e13be943fd1" }
portable-pty = "=0.9.0"
libc = "0.2"

[features]
# `cargo run --release --features perf`, then F12: iced's timing overlay
# (Update / View / Layout / Primitive generation / Render averages).
perf = ["iced/debug"]

# Only to hook applicationShouldTerminate: onto winit's app delegate
# (src/quit.rs). Versions match the ones winit 0.30 already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["NSApplication", "NSResponder", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["NSString"] }

# Bundle metadata for `cargo bundle` (cargo-bundle). The identifier is fixed:
# macOS keys notification permission and settings off it. Do not change it.
[package.metadata.bundle]
name = "JAIT"
identifier = "com.jait.desktop"
version = "0.16.0"
short_description = "JAIT desktop companion"
category = "public.app-category.productivity"
# Generated from assets/appicon-default.svg by scripts/build-icon.sh.
icon = ["assets/AppIcon.icns"]
